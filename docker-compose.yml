# Phase 1 of the musicai-stack pivot (ADR 0004, 0005).
# RVC voice-cloning service. ACE-Step is currently run via manual
# `docker run` — when migrating it to compose, add an `ace-step:`
# service block here on port 7860 and point the existing
# server/acestep.ts client at the new container name.

services:
  rvc:
    # The RVC-Project/Retrieval-based-Voice-Conversion-WebUI repo ships
    # a Dockerfile but no published image. Build locally:
    #   git clone https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI
    #   cd Retrieval-based-Voice-Conversion-WebUI && docker build -t rvc-webui .
    # Then `docker compose up rvc` here.
    image: rvc-webui:latest
    container_name: rvc
    ports:
      - "7865:7865"  # Gradio default. ACE-Step uses 7860 — no conflict.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      # Bind mounts so server/voice-storage.ts can read/write directly
      # without docker cp shuttling. Container-side paths match RVC's
      # Dockerfile layout (FROM nvidia/cuda + WORKDIR /app):
      #   - dataset path is freeform — we pass /app/dataset/<uid>/<vid>
      #     as the trainset_dir4 arg to train1key
      #   - weights live at /app/assets/weights/ (RVC writes final .pth
      #     and added_IVF*.index here)
      #   - backing track read-only; rvc.ts passes /app/backing/<file>
      #     as the input_audio_path arg to vc_single
      - ./server/voice-samples:/app/dataset
      - ./server/voice-models:/app/assets/weights
      - ./server/voice-train-logs:/app/logs
      - ./server/voice-demo-backing:/app/backing:ro
      # Python wrapper that runs train1key via `docker exec`. RVC's
      # Gradio 3.34 generator-based training can't be driven via raw HTTP
      # (queue=None + first-yield-only behavior), so server/rvc.ts spawns
      # `docker exec rvc python /runner/train.py <json-args>` instead.
      - ./server/rvc-runner:/runner:ro
      # PyTorch 2.6+ weights_only patch — see sitecustomize.py header.
      # Mounted directly into Python's site-packages so it auto-loads
      # for the main Gradio server AND every spawned training subprocess.
      - ./server/rvc-runner/sitecustomize.py:/usr/lib/python3.9/sitecustomize.py:ro
    restart: unless-stopped
